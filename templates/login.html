<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pal Server Admin — Login</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #14171c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    background: #1c2029; border: 1px solid #2a2f3a; border-radius: 12px;
    padding: 36px 32px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  h1 { color: #e8eaed; font-size: 20px; margin: 0 0 22px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px; }
  h1 img { height: 28px; width: 28px; border-radius: 50%; object-fit: cover; }
  input[type=password] {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid #333a47;
    background: #12151b; color: #e8eaed; font-size: 15px; margin-bottom: 14px;
  }
  input[type=password]:focus { outline: none; border-color: #5b8cff; }
  button {
    width: 100%; padding: 11px; border: none; border-radius: 8px;
    background: #5b8cff; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #4a7aff; }
  .flash { color: #ff6b6b; font-size: 13px; margin-bottom: 14px; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <h1><img src="{{ url_for('static', filename='logo.png') }}" alt=""> Pal Server Admin</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <input type="password" name="password" placeholder="Password" autofocus required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
